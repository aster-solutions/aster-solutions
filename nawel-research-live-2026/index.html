<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nawel Benarba — Research</title><style>html,body{margin:0;min-height:100%;background:#fbfaf8;font-family:system-ui,sans-serif;color:#173A5E}.loading{min-height:100vh;display:grid;place-items:center}.loading div{text-align:center}.spinner{width:34px;height:34px;margin:0 auto 14px;border:3px solid #dce6ee;border-top-color:#3F6F9F;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="loading"><div><div class="spinner"></div>Loading…</div></div><script>(async()=>{try{const files=['part0.txt','part1.txt','part2.txt','part3.txt','part4.txt','part5.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}));const html=parts.join('');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><strong>Unable to load the site.</strong><br><small>'+e.message+'</small></div></div>'}})();</script></body></html>
