<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nawel Benarba</title><style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f7f8fc;color:#193156}.loader{padding:24px 28px;border:1px solid #e6e9f2;border-radius:18px;background:white;box-shadow:0 16px 48px rgba(25,49,86,.08)}</style></head><body><div class="loader">Loading the updated site…</div><script>(async()=>{try{const base='https://raw.githubusercontent.com/aster-solutions/aster-solutions/main/nawel-v8/';const names=['c1.txt','c2.txt','c3.txt','c4a.txt','c4b.txt','c5.txt'];const parts=await Promise.all(names.map(n=>fetch(base+n+'?v=8').then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loader">Unable to load the site. Please refresh.</div>';console.error(e)}})();</script></body></html>
